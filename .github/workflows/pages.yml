name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The workflow token cannot create a Pages site (HTTP 403). This repo already
      # uses Settings → Pages → Source = GitHub Actions, so deploy-pages is enough.
      # set +e: bash -e would stop on the 403 and skip the update.
      - name: Ensure GitHub Pages uses the Actions source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            --input - <<'EOF'
          {"build_type":"workflow"}
          EOF
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            --input - <<'EOF'
          {"build_type":"workflow"}
          EOF
          exit 0
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
